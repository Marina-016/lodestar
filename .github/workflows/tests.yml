name: V0 regression

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: v0-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e ".[web-search]" wheel
      - run: python -m unittest discover -s tests -q
      - run: node --test tests/web_sources.test.mjs
      - run: node --check lodestar/web/static/app.mjs
      - run: python -m pip check
      - run: python scripts/preflight_public_release.py
      - run: python -m pip wheel --no-deps --no-build-isolation . --wheel-dir dist
